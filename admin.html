<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cabana Garibalde | Painel Administrativo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f2eb;color:#183d2d;font-family:system-ui,-apple-system,Arial,sans-serif}header{background:#163e2d;color:#fff;padding:28px 20px;border-radius:0 0 22px 22px}main{max-width:850px;margin:25px auto;padding:0 18px 40px}h1{font:32px Georgia,serif;margin:0}h2{font:26px Georgia,serif}.card{background:#fff;padding:20px;border-radius:18px;margin:15px 0;box-shadow:0 6px 25px #173f2910}input{display:block;width:100%;padding:14px;border:1px solid #d4dcd4;border-radius:10px;margin:12px 0;font-size:16px}button{border:0;border-radius:10px;padding:12px 16px;cursor:pointer;font-weight:700;font-size:14px}button:disabled{opacity:.55;cursor:wait}.primary{background:#235b42;color:white;width:100%}.yes{background:#235b42;color:white}.no{background:#f0e5e2;color:#8c3939}.muted{color:#66766d;font-size:14px}.actions{display:flex;gap:10px;margin-top:15px;flex-wrap:wrap}.hidden{display:none!important}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.top button{background:#ffffff24;color:inherit}.tag{background:#f5e8ce;padding:5px 11px;border-radius:50px;font-size:12px;font-weight:700;white-space:nowrap}.tag.aprovada{background:#dceee2;color:#1b5c39}.tag.negada{background:#f6dede;color:#8c3939}.section{background:#f7f7f3;border-radius:12px;padding:14px;margin:14px 0}.section h3{margin:0 0 12px;font-size:15px}.line{display:flex;justify-content:space-between;gap:12px;padding:5px 0;flex-wrap:wrap}.line span:last-child{text-align:right}.total{font-size:19px;font-weight:800;border-top:1px solid #dce5dc;padding-top:10px;margin-top:8px}.pill{display:inline-block;background:#e5eee7;color:#235b42;border-radius:20px;padding:4px 10px;font-size:12px;font-weight:700}.none{color:#66766d;font-style:italic}.error{color:#9d3535}.wa{color:#225c44;font-weight:600}.heading{font-size:18px;font-weight:800;margin:0}.meta{margin:8px 0 0;color:#617368;font-size:14px}#logout{background:#ffffff22;color:white}#refresh{background:#e3eae3;color:#183d2d}@media(max-width:560px){header{padding:22px 16px}h1{font-size:27px}h2{font-size:24px}.card{padding:16px}.line{font-size:14px}}
</style></head><body>
<header><div class="top"><h1>Cabana Garibalde</h1><button id="logout" class="hidden">Sair</button></div><div>Painel de reservas • Garibalde</div></header>
<main><section id="login" class="card"><h2>Acesso do Garibalde</h2><p class="muted">Entre com o e-mail e a senha cadastrados no Supabase.</p><form id="loginForm"><input id="email" type="email" value="cabana.garibalde@gmail.com" autocomplete="username" required><input id="password" type="password" placeholder="Senha" autocomplete="current-password" required><button class="primary" type="submit">Entrar</button></form></section>
<section id="dashboard" class="hidden"><div class="top"><h2>Solicitações</h2><button id="refresh">Atualizar ↻</button></div><p class="muted">Confira o comprovante e o recebimento do Pix antes de aprovar. Apenas reservas aprovadas bloqueiam datas.</p><div id="items"></div></section><p id="message" class="muted" role="status" aria-live="polite"></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
'use strict';
const client=window.supabase.createClient('https://rntciuxfndgeazwsuwxm.supabase.co','sb_publishable_TDivET7FHAKNj_Z8D2Fi5A_gaAGC9JQ');
const $=id=>document.getElementById(id);
const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmt=d=>d?new Date(String(d).slice(0,10)+'T12:00:00').toLocaleDateString('pt-BR'):'—';
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeNumber=(n,def=0)=>Number.isFinite(Number(n))?Number(n):def;
function nights(start,end){if(!start||!end)return 0;const a=Date.parse(String(start).slice(0,10)+'T12:00:00Z'),b=Date.parse(String(end).slice(0,10)+'T12:00:00Z');return Math.max(0,Math.round((b-a)/86400000))}
function row(label,value){return `<div class="line"><span>${escapeHtml(label)}</span><span>${escapeHtml(value)}</span></div>`}
function extrasHtml(r){
  const decor=!!r.decoracao_romantica;
  const petals=Math.max(0,Math.trunc(safeNumber(r.pacotes_petalas)));
  const where=String(r.local_petalas||'').trim();
  const valueDecor=decor?120:0, valuePetals=petals*50;
  const stored=safeNumber(r.valor_adicionais,NaN);
  const extras=Number.isFinite(stored)?stored:valueDecor+valuePetals;
  const known=['decoracao_romantica','pacotes_petalas','local_petalas','valor_adicionais'].some(k=>Object.prototype.hasOwnProperty.call(r,k));
  let html='<div class="section"><h3>❤️ Adicionais solicitados</h3>';
  if(!known)html+='<p class="none">Adicionais ainda não registrados no banco de dados.</p>';
  else if(!decor&&!petals)html+='<p class="none">Nenhum adicional solicitado.</p>';
  else{
    if(decor)html+=row('Decoração romântica',money(valueDecor));
    if(petals)html+=row(`${petals} pacote(s) de pétalas`,money(valuePetals));
    if(petals&&where)html+=row('Local das pétalas',where);
  }
  html+=row('Total dos adicionais',money(extras))+'</div>';
  return {html,extras};
}
async function refreshAuth(){const {data,error}=await client.auth.getSession();if(error){$('message').textContent=error.message;return}const ok=!!data.session;$('login').classList.toggle('hidden',ok);$('dashboard').classList.toggle('hidden',!ok);$('logout').classList.toggle('hidden',!ok);if(ok)await load()}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('message').textContent='Entrando...';const {error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('message').textContent=error?error.message:'';if(!error)await refreshAuth()};
$('logout').onclick=async()=>{await client.auth.signOut();$('items').replaceChildren();await refreshAuth()};
$('refresh').onclick=()=>load();
async function load(){
 $('message').textContent='Atualizando...';
 const {data,error}=await client.from('reservas').select('*').order('criado_em',{ascending:false}).limit(150);
 if(error){$('message').textContent='Erro ao carregar reservas: '+error.message;return}
 $('message').textContent='';$('items').replaceChildren();
 if(!(data||[]).length){$('items').innerHTML='<div class="card">Nenhuma solicitação ainda.</div>';return}
 for(const r of data){
  const div=document.createElement('article');div.className='card';
  const pending=r.status==='pendente';
  const {html:extrasHtmlContent,extras}=extrasHtml(r);
  const lodging=safeNumber(r.valor_total);
  const total=lodging+extras;
  const phone=String(r.telefone||'').replace(/\D/g,'').replace(/^0+/,'');
  const wa=phone?(phone.startsWith('55')?phone:'55'+phone):'';
  const contact=wa?`<a class="wa" href="https://wa.me/${wa}" target="_blank" rel="noopener noreferrer">${escapeHtml(r.telefone)} • Conversar no WhatsApp</a>`:escapeHtml(r.telefone||'Não informado');
  div.innerHTML=`<div class="top"><p class="heading">${escapeHtml(r.nome_hospede||'Hóspede sem nome')}</p><span class="tag ${escapeHtml(r.status)}">${escapeHtml(r.status||'—')}</span></div>
  <p class="meta">Cabana ${escapeHtml(r.cabana_id)} • ${nights(r.checkin,r.checkout)} diária(s)</p>
  <div class="section"><h3>📅 Dados da reserva</h3>${row('Entrada',fmt(r.checkin))}${row('Saída',fmt(r.checkout))}${row('E-mail',r.email||'Não informado')}<div class="line"><span>Telefone</span><span>${contact}</span></div></div>
  ${extrasHtmlContent}
  <div class="section"><h3>💰 Valores</h3>${row('Hospedagem',money(lodging))}${row('Adicionais',money(extras))}<div class="line total"><span>Total estimado</span><span>${money(total)}</span></div>${row('Sinal da hospedagem (30%)',money(r.valor_sinal))}<p class="muted">Os adicionais são cobrados/confirmados separadamente. Confira os valores antes de aprovar.</p></div>
  <p class="muted">Solicitada em ${r.criado_em?new Date(r.criado_em).toLocaleString('pt-BR'):'—'}</p>`;
  if(pending){const actions=document.createElement('div');actions.className='actions';for(const [label,approve,cls] of [['✓ Aprovar',true,'yes'],['✕ Reprovar',false,'no']]){const b=document.createElement('button');b.textContent=label;b.className=cls;b.onclick=async()=>{if(!confirm(approve?'Você conferiu o Pix e deseja aprovar esta reserva?':'Deseja reprovar esta pré-reserva?'))return;for(const x of actions.querySelectorAll('button'))x.disabled=true;const {error}=await client.rpc('decidir_reserva',{p_reserva_id:r.id,p_aprovar:approve});if(error){alert('Não foi possível atualizar: '+error.message);for(const x of actions.querySelectorAll('button'))x.disabled=false;return}await load()};actions.appendChild(b)}div.appendChild(actions)}
  $('items').appendChild(div);
 }
}
refreshAuth();
</script></body></html>
