<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cabana Garibalde | Painel Gabriel</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f2eb;color:#183d2d;font-family:system-ui,Arial}header{background:#163e2d;color:white;padding:28px 20px;border-radius:0 0 22px 22px}main{max-width:650px;margin:25px auto;padding:0 18px}h1{font:32px Georgia;margin:0}h2{font:26px Georgia}.card{background:white;padding:20px;border-radius:18px;margin:15px 0;box-shadow:0 6px 25px #173f2910}input{display:block;width:100%;padding:14px;border:1px solid #d4dcd4;border-radius:10px;margin:12px 0;font-size:16px}button{border:0;border-radius:10px;padding:12px 16px;cursor:pointer;font-weight:700}.primary{background:#235b42;color:white;width:100%}.yes{background:#235b42;color:white}.no{background:#f0e5e2;color:#8c3939}.muted{color:#66766d;font-size:14px}.actions{display:flex;gap:10px;margin-top:15px}.hidden{display:none}.top{display:flex;justify-content:space-between;align-items:center}.top button{background:#fff2;color:white}.tag{background:#f5e8ce;padding:4px 9px;border-radius:50px;font-size:12px}a{color:#225c44}</style></head><body><header><div class="top"><h1>Cabana Garibalde</h1><button id="logout" class="hidden">Sair</button></div><div>Administração de pré-reservas</div></header><main><section id="login" class="card"><h2>Acesso do Gabriel</h2><p class="muted">Entre com o e-mail e a senha cadastrados em Authentication no Supabase.</p><form id="loginForm"><input id="email" type="email" value="cabana.garibalde@gmail.com" required><input id="password" type="password" placeholder="Senha" required><button class="primary">Entrar</button></form></section><section id="dashboard" class="hidden"><div class="top"><h2>Solicitações</h2><button onclick="load()">Atualizar ↻</button></div><p class="muted">Confira o Pix recebido antes de aprovar. Somente aprovações bloqueiam datas.</p><div id="items"></div></section><p id="message" class="muted"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>const client=window.supabase.createClient('https://rntciuxfndgeazwsuwxm.supabase.co','sb_publishable_TDivET7FHAKNj_Z8D2Fi5A_gaAGC9JQ');const $=id=>document.getElementById(id);const money=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('pt-BR');const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function refreshAuth(){const {data}=await client.auth.getSession();const ok=!!data.session;$('login').classList.toggle('hidden',ok);$('dashboard').classList.toggle('hidden',!ok);$('logout').classList.toggle('hidden',!ok);if(ok)await load()}$('loginForm').onsubmit=async e=>{e.preventDefault();$('message').textContent='Entrando...';const {error}=await client.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('message').textContent=error?error.message:'';if(!error)refreshAuth()};$('logout').onclick=async()=>{await client.auth.signOut();refreshAuth()};async function load(){$('message').textContent='Atualizando...';const {data,error}=await client.from('reservas').select('*').order('criado_em',{ascending:false}).limit(150);if(error){$('message').textContent=error.message;return}$('message').textContent='';$('items').innerHTML=(data||[]).length?'':'<div class="card">Nenhuma solicitação ainda.</div>';for(const r of data||[]){const div=document.createElement('div');div.className='card';const pending=r.status==='pendente';div.innerHTML=`<div class="top"><strong>${escapeHtml(r.nome_hospede)}</strong><span class="tag">${escapeHtml(r.status)}</span></div><p>Cabana ${r.cabana_id} · ${fmt(r.checkin)} a ${fmt(r.checkout)}</p><p><b>Total:</b> ${money(r.valor_total)} · <b>Sinal:</b> ${money(r.valor_sinal)}</p><p><a href="https://wa.me/${String(r.telefone).replace(/\D/g,'').replace(/^0+/,'')}" target="_blank" rel="noopener">${escapeHtml(r.telefone)}</a></p><p class="muted">Solicitada em ${new Date(r.criado_em).toLocaleString('pt-BR')}</p>`;if(pending){const actions=document.createElement('div');actions.className='actions';for(const [label,approve,cls] of [['Aprovar',true,'yes'],['Negar',false,'no']]){const b=document.createElement('button');b.textContent=label;b.className=cls;b.onclick=async()=>{if(!confirm(approve?'Você conferiu o Pix e deseja aprovar esta reserva?':'Deseja negar esta pré-reserva?'))return;b.disabled=true;const {error}=await client.rpc('decidir_reserva',{p_reserva_id:r.id,p_aprovar:approve});if(error)alert('Não foi possível atualizar: '+error.message);await load()};actions.appendChild(b)}div.appendChild(actions)}$('items').appendChild(div)}}refreshAuth();</script></body></html>
